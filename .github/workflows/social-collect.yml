# Social collector: daily snapshot of Prove-It's own social metrics.
#
# Scheduler choice: GitHub Actions over Vercel Cron, because the collector
# fans out to three free APIs per project (8 projects, ~1.5s politeness
# delay between them) and can run past serverless duration limits. The job
# is idempotent: each run inserts one snapshot row per project.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY   (writes only; the app reads via RLS + anon key)
# Optional:
#   REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET
#     Free app registration at https://www.reddit.com/prefs/apps
#     (type: script). Without them the Reddit metric is skipped, not faked.

name: social-collect

on:
  schedule:
    # Daily at 06:30 UTC, after the GitHub vitals refresh window.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run social:collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
