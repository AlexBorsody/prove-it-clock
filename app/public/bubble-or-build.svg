<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Bubble or Build — Concept 1: growth inside the bubble</title>
  <!-- bubble outline -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#7dd3fc" stroke-width="3.5"/>
  <!-- bubble highlight -->
  <path d="M19 20 A17 17 0 0 1 27 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <!-- pixel bars rising = building real value -->
  <g fill="#4ade80">
    <rect x="20" y="42" width="9" height="9"/>
    <rect x="31.5" y="34" width="9" height="17"/>
    <rect x="43" y="26" width="9" height="25"/>
  </g>
</svg>
